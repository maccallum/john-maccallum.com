<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title and page.url != "/" %}
  <title>{{ page.title }} · John MacCallum</title>
  {%- else %}
  <title>{{ site.title }}</title>
  {%- endif %}
  {%- assign description = page.description | default: site.description | strip_newlines | strip %}
  <meta name="description" content="{{ description | escape }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.author }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "John MacCallum",
    "jobTitle": "Composer and musical systems designer",
    "description": {{ site.description | strip_newlines | strip | jsonify }},
    "url": "{{ site.url }}",
    "email": "mailto:{{ site.email }}",
    "alumniOf": [
      {"@type": "CollegeOrUniversity", "name": "University of California, Berkeley"},
      {"@type": "CollegeOrUniversity", "name": "McGill University"},
      {"@type": "CollegeOrUniversity", "name": "University of the Pacific"}
    ],
    "sameAs": [
      "{{ site.links.bandcamp }}",
      "{{ site.links.github }}",
      "{{ site.links.linktree }}"
    ]
  }
  </script>
  {%- endif %}
</head>
