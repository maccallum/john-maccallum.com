{%- comment -%} An embedded recording or video. include.item: {label, embed, url, height}; include.kind: audio | video {%- endcomment -%}
{%- assign item = include.item -%}
{%- if include.kind == "video" %}
<figure class="media">
  <div class="video"><iframe src="{{ item.embed }}" title="{{ include.title | strip_html }}, {{ item.label }}" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  {%- if item.url contains "vimeo" %}{% assign host = "Vimeo" %}{% else %}{% assign host = "YouTube" %}{% endif %}
  <figcaption>{{ item.label }}{% if item.url %} · <a href="{{ item.url }}">{{ host }}</a>{% endif %}</figcaption>
</figure>
{%- else %}
<figure class="media audio">
  <iframe src="{{ item.embed }}" style="height: {{ item.height | default: 120 }}px" title="{{ include.title | strip_html }}, {{ item.label }}" loading="lazy" seamless></iframe>
  {%- if item.url %}
  <figcaption>{{ item.label }} · <a href="{{ item.url }}">Bandcamp</a></figcaption>
  {%- else %}
  <figcaption>{{ item.label }}</figcaption>
  {%- endif %}
</figure>
{%- endif %}
