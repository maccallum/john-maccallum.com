# john-maccallum.com
# Build: bundle exec jekyll build   Preview: bundle exec jekyll serve

title: "John MacCallum, composer and musical systems designer"
author: John MacCallum
tagline: Composer and musical systems designer
description: >-
  John MacCallum is a composer, media artist, and software engineer whose
  work uses technology to probe our relationship to time, with the heart
  as timekeeper. Works, recordings, scores, and the software he builds.
email: john.m@ccallum.com
url: "https://john-maccallum.com"
baseurl: ""

# Outbound links. Vimeo, LinkedIn, and Google Scholar are added once their
# URLs are confirmed.
links:
  bandcamp: "https://john-maccallum.bandcamp.com"
  github: "https://github.com/maccallum"
  odot: "https://github.com/CNMAT/CNMAT-odot"
  rtecg: "https://github.com/maccallum/rtecg"
  linktree: "https://linktr.ee/john.maccallum"
  frictionfield: "https://frictionfield.co"
  iii: "https://iii-iii-iii.org"
  immediations: "https://immediations.com"
  interstitial_listening: "https://interstitial-listening.com"

# Navigation on every page except the front page, which has its own.
nav:
  - {label: Works, href: "/works/"}
  - {label: Software, href: "/software/"}
  - {label: Writing, href: "/writing/"}
  - {label: Teaching, href: "/teaching/"}
  - {label: About, href: "/about/"}
  - {label: Contact, href: "/#contact"}

collections:
  works:
    output: true
    permalink: /works/:name/
  publications:
    output: false   # later: /writing

defaults:
  - scope: {path: "", type: works}
    values: {layout: work}

# The 2021 draft pages and the PHP site's folders stay in the repo as
# sources but are not built.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .sass-cache
  - .zsh_history
  - "*.php"
  - make-bg.pl
  - wind.js
  - iii.txt
  # Old work folders: the PDFs and zips are published at their old paths so
  # direct links keep working; the PHP page fragments are not.
  - "compositions/*.txt"
  - "compositions/*~"
  - "compositions/*/soundcloud"
  - "compositions/*/dontmessup"
  - compositions/iii_circulation
  - "software/*.txt"
  - writings
  - cv
  - _compositions
  - _performance_work
  - _ptags
  - _sass
  - about.html
  - compositions.html
  - musical_systems_design.html
  - performance_work.html
  - publications.html
  - assets/css/main.scss
  - assets/js

# CV PDFs, served from assets/cv/ once there is a public version
# (the application CV carries a phone number and home address). While
# empty, the front page offers the CV by email.
cv_full: ""
cv_one_page: ""

markdown: kramdown
kramdown:
  input: kramdown      # plain kramdown; no extra gem needed
  smart_quotes: ["apos", "apos", "quot", "quot"]   # the notes already use curly quotes
