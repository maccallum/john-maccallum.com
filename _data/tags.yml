# Tags used in _data/works.yml (and, later, software and writing).
# To add a tag: add it here, then to the items it applies to. To rename
# one: change `name` here and find-and-replace it in works.yml.

forms:
  - name: notated
    label: Notated
    about: A score exists for performers to play.
  - name: live electronics
    label: Live electronics
    about: Sound made or changed by computer during the performance.
  - name: performance art
    label: Performance art
    about: Performance outside the concert format.
  - name: installation
    label: Installation
    about: A space that visitors enter.
  - name: video
    label: Video
    about: Films, and works that use video.
  - name: livestream
    label: Livestream
    about: Streamed live online.

themes:
  - name: time
    label: Time
    about: Tempo and synchrony, including music in independent, continuously varying tempos.
  - name: heart
    label: Heart
    about: Heartbeat and breath, sensed by ECG and stethoscope.
  - name: duration
    label: Duration
    about: Performances lasting from three to seventy-two hours.
  - name: cameras
    label: Cameras
    about: Works built on camera arrays and live video.
  - name: networks
    label: Networks
    about: Networked sensors, computers, and cameras, and OpenSoundControl.
  - name: listening
    label: Listening
    about: Works built around listening to the body.
