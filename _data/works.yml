# One entry per work. Drives the front page, the works index at /works,
# and the pages at /works/<slug> (notated and electroacoustic works; the
# collaborative works are documented on their project sites).
#
# Facts (year, forces, duration, commission, performances) come from
# professional_docs/workslist/workslist.tex and the old site's folders
# (compositions/<folder>/). Do not add a fact that is in neither.
#
# collaborative: true for the works with Teoma Naccarato; `external` is the
#                project page (frictionfield.co once it exists)
# forms:         what the work is made of; as many as apply. Defined in
#                _data/tags.yml
# themes:        what the work is about; as many as honestly apply.
#                Defined in _data/tags.yml
# featured:      1-3, the order on the front page
# legacy:        folder on the old PHP site (for redirects)
# recordings,
# videos:        [{label, embed, url}]; embed is the player URL
# materials:     [{label, url, note}]; files live in compositions/<folder>/,
#                the old site's paths, so old direct links keep working
# music:         standalone electroacoustic version of a collaborative work
#                {duration, about, recordings}
# performances:  most recent first; premiere: true marks the premiere

# ---------------------------------------------------------------
# Performance, video, and installation works, with Teoma Naccarato
# ---------------------------------------------------------------

- slug: once-replete
  title: "III: Once Replete"
  year: "2023"
  collaborative: true
  forces: "Two performers beneath plaster casts onto which video from III: Once Returned is projected; heartbeats sonified live from ECGs"
  duration: "6 h"
  support: "National Performance Network (NPN) Stepping Out, with funds from the German Federal Government Commissioner for Culture and the Media"
  forms: [performance art, installation, video, live electronics]
  themes: [heart, duration]
  external: "https://iii-iii-iii.org/about/iii-once-replete/"
  featured: 1
  summary: >-
    Six-hour durational performance inside a video and audio installation.
    Two performers wearing electrocardiograms; the sound is composed live
    from their heart signals. Premiered June 1–3, 2023, SomoS Art Gallery,
    Berlin.
  videos: []
  music:
    duration: "26′"
    about: "Electroacoustic; the music of the performance as a standalone work"
    recordings:
      - {label: "III: Once Replete", embed: "https://bandcamp.com/EmbeddedPlayer/track=4109121422/size=large/bgcol=ffffff/linkcol=333333/tracklist=false/artwork=small/transparent=true/", url: "https://john-maccallum.bandcamp.com/track/iii-once-replete"}
  performances:
    - {date: "June 1–3, 2023", venue: "SomoS Art Gallery, Berlin", premiere: true}

- slug: once-returned
  title: "III: Once Returned"
  year: "2022"
  collaborative: true
  forces: "A six-hour choreography repeated twelve times without stopping, every action scripted by a metronome; two performers wearing ECGs, 12-camera video array, live audio from the electrocardiograms"
  duration: "72 h"
  support: "National Performance Network (NPN) Stepping Out, with funds from the German Federal Government Commissioner for Culture and the Media"
  forms: [performance art, video, live electronics, livestream]
  themes: [time, heart, duration, cameras, networks]
  external: "https://iii-iii-iii.org/about/iii-oncereturned/"
  featured: 2
  summary: >-
    Seventy-two-hour continuous live-streamed performance within a
    twelve-camera video array. Click-track scores guide every movement,
    including breath; the audio is composed in real time from two ECGs.
    Premiered May 30–June 2, 2022, Atelier III, Berlin.
  videos: []
  performances:
    - {date: "May 30–June 2, 2022", venue: "Atelier III, Berlin, live-streamed", premiere: true}

