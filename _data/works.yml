- slug: once-replete
  title: "III: Once Replete"
  year: "2023"
  kind: performance
  collaborative: true
  forces: "Two performers beneath plaster casts onto which video from III: Once Returned is projected; heartbeats sonified live from ECGs"
  duration: "6 h"
  support: "National Performance Network (NPN) Stepping Out, with funds from the German Federal Government Commissioner for Culture and the Media"
  threads: [time, instruments, collaboration]
  external: "https://iii-iii-iii.org/about/iii-once-replete/"
  featured: 1
  summary: >-
    Six-hour durational performance inside a video and audio installation.
    Two performers wearing electrocardiograms; the sound is composed live
    from their heart signals. Premiered June 1–3, 2023, SomoS Art Gallery,
    Berlin.
  videos: []   # [{label: "Excerpt", embed: "<player URL>", url: "<page URL>"}]

- slug: once-returned
  title: "III: Once Returned"
  year: "2022"
  kind: performance
  collaborative: true
  forces: "72-hour continuous live-streamed performance: a six-hour choreography repeated twelve times without stopping, every action scripted by a metronome; two performers wearing ECGs, 12-camera video array, live audio from the electrocardiograms"
  duration: "72 h"
  support: "National Performance Network (NPN) Stepping Out, with funds from the German Federal Government Commissioner for Culture and the Media"
  threads: [time, instruments, collaboration]
  external: "https://iii-iii-iii.org/about/iii-oncereturned/"
  featured: 2
  summary: >-
    Seventy-two-hour continuous live-streamed performance within a
    twelve-camera video array. Click-track scores guide every movement,
    including breath; the audio is composed in real time from two ECGs.
    Premiered May 30–June 2, 2022, Atelier III, Berlin.
  videos: []

