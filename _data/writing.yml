- id: 2015_BressonMacCallum_SMC_TempoCurving
  kind: conference
  title: Tempo Curving as a Framework for Interactive Computer-Aided Composition
  authors:
  - Jean Bresson
  - John MacCallum
  venue: Proceedings of the Sound and Music Computing Conference (SMC)
  details: Maynooth
  year: '2015'
  pdf: /assets/papers/2015_BressonMacCallum_SMC_TempoCurving.pdf
  abstract: We present computer-aided composition experiments related to the notions of polyrhythmic structures
    and variable tempo curves. We propose a formal context and some tools that enable the generation of
    complex polyrhythms with continuously varying tempos integrated in compositional processes and performance,
    implemented as algorithms and user interfaces.
- id: 2015_MacCallumGooheartFreed_ICMC_Antony
  kind: conference
  title: 'Antony: A Reimagining'
  authors:
  - John MacCallum
  - Matthew Goodheart
  - Adrian Freed
  venue: Proceedings of the International Computer Music Conference
  details: Denton, Texas
  year: '2015'
  pdf: /assets/papers/2015_MacCallumGooheartFreed_ICMC_Antony.pdf
  abstract: We present a re-realization of David Wessel’s Antony (1977). Antony was originally composed
    using a novel set of additive synthesis techniques developed for the 4A and the PDP 11/40. Those techniques
    continued to play a role throughout Wessel’s life as an improviser, and inspired many of his students
    and colleagues. Our re-realization of Antony involves using those same techniques to reinterpret and
    perform the very piece that they were used to create.
- id: 2015_MacCallumEtAl_ICMC_MessageOrientedMiddleware
  kind: conference
  title: Dynamic Message-Oriented Middleware with Open Sound Control and Odot
  authors:
  - John MacCallum
  - Rama Gottfried
  - Ilya Rostovtsev
  - Jean Bresson
  - Adrian Freed
  venue: Proceedings of the International Computer Music Conference
  details: Denton, Texas
  year: '2015'
  pdf: /assets/papers/2015_MacCallumEtAl_ICMC_MessageOrientedMiddleware.pdf
  abstract: We present recent work on odot, a system that extends Open Sound Control and facilitates the
    rapid and dynamic construction of Message-Oriented Middleware providing an interoperability layer
    for communication between applications. Unlike traditional middleware systems, odot, when embedded
    in a host environment, provides a node where computation can take place, allowing middleware to take
    shape dynamically as the needs of the system develop.
- id: 2015_BressonEtAl_JIM_ProjetEfficace
  kind: conference
  title: 'Projet EFFICACe : développements et perspectives en composition assistée par ordinateur'
  authors:
  - Jean Bresson
  - Dimitri Bouche
  - Jérémie Garcia
  - Thibaut Carpentier
  - Florent Jacquemard
