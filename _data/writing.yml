- id: 2016_NaccaratoMacCallum_JDSP_FromRepresentationToRelationality
  kind: article
  title: 'From Representation to Relationality: Bodies, Biosensors and Mediated Environments'
  authors:
  - Teoma Jackson Naccarato
  - John MacCallum
  venue: Journal of Dance & Somatic Practices
  details: '8 (1): 57–72'
  year: '2016'
  doi: 10.1386/jdsp.8.1.57_1
  pdf: /assets/papers/2016_NaccaratoMacCallum_JDSP_FromRepresentationToRelationality.pdf
  abstract: In this article we propose a biorelational framework for performance with biosensors, in which
    interactions are not based on causality, control, and representation, but rather, manifest through
    shared awareness and agency across multiple, fluid assemblies of self, other and environment. The
    transdisciplinary scope of this study traces trajectories from the performing and somatic arts into
    philosophy, biomedicine, cognitive science and human-computer interaction. A brief survey of common
    approaches to interaction design with biosensors will contextualize discussion of our current practice-based
    research and creation project, ‘Choreography and Composition of Internal Time’. In this project, we
    are examining temporal relationships between physiological processes, such as heart rate and breath,
    with rhythms in movement, music and mediated environments.
- id: 2017_NaccaratoMacCallum_MOCO_CriticalAppropriationsOfBiosensorsInArtisticPractice
  kind: conference
  title: Critical Appropriations of Biosensors in Artistic Practice
  authors:
  - Teoma J. Naccarato
  - John MacCallum
  venue: Proceedings of the 4th International Conference on Movement Computing (MOCO)
  details: London, 1–7
  year: '2017'
  doi: 10.1145/3077981.3078053
  pdf: /assets/papers/2017_NaccaratoMacCallum_MOCO_CriticalAppropriationsOfBiosensorsInArtisticPractice.pdf
  abstract: In this article we discuss the ethical and æsthetic implications of the appropriation of biomedical
    sensors in artistic practice. The concept of cross-disciplinary appropriation is elaborated with reference
    to Guattari’s ethico-æsthetic paradigms, and Barad’s metaphor of diffraction as methodology. In reviewing
    existing artistic projects with biosensors, we consider ways in which the recontextualization of technologies,
    and likewise techniques, can both propagate and violate disciplinary expectations and approaches.
    We propose that by way of critical appropriations of biosensors in artistic practice—that is to say,
    de- and re-contextualizations of biosensors that acknowledge the shift of ecology and epistemology—artists
    have a vital role to play in troubling reductive representations of bodies, and furthermore, destabilizing
    the ethico-æsthetic boundaries of differently constituted disciplines.
- id: 2016_BressonMacCallumFreed_FARM-ICFP_o.OM
  kind: conference
  title: 'o.OM: Structured-Functional Communication between Computer Music Systems using OSC and Odot'
  authors:
  - Jean Bresson
  - John MacCallum
  - Adrian Freed
  venue: Proceedings of the 4th International Workshop on Functional Art, Music, Modelling, and Design
    (FARM)
  details: Nara, 41–47
  year: '2016'
  doi: 10.1145/2975980.2975985
  pdf: /assets/papers/2016_BressonMacCallumFreed_FARM-ICFP_o.OM.pdf
  abstract: 'O.—odot—is a portable media programming framework based on the OSC data encoding. It embeds
    a small expression language which allows writing and executing programs in OSC structures. The integration
    of programming and declarative functional descriptions within data transfer protocols enables structured
    and expressive communication in media systems: program snippets can be distributed in OSC messages,
    which evaluate to further OSC messages in the different communicating software. We present experiments
    using this framework in the OpenMusic computer-aided composition environment, and illustrate via case
    studies some advantages of such integrated system.'
- id: 2015_MacCallumNaccarato_EVA_TheImpossibilityOfControl
  kind: conference
  title: 'The Impossibility of Control: Real-time Negotiations with the Heart'
  authors:
  - John MacCallum
  - Teoma Naccarato
  venue: Proceedings of Electronic Visualisation and the Arts (EVA)
  details: London, 184–191
  year: '2015'
  doi: 10.14236/ewic/eva2015.19
  pdf: /assets/papers/2015_MacCallumNaccarato_EVA_TheImpossibilityOfControl.pdf
  abstract: 'We present a practice-based research project, which examines temporal relationships between
    physiological processes with human movement and mediated environments. Ongoing research will provide
    a foundation for the creation of performances in which real-time heart rate data from contemporary
    dancers is used to generate click tracks for live musicians. The complex constructions of time in
    this project necessitate novel visualization strategies throughout the research, development, creation,
    and production process, including: time domain display of data with rich and facile interaction using
    bokeh; visualization of biometric data as a form of biofeedback; and unique representations of time
    in music notation.'
